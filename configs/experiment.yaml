# Group 23 — formal experiment configuration.
# One shared config for the three label strategies; the --strategy flag
# selects the run. Fill in image_root before launching on the GPU machine.

data:
  image_root: /path/to/CheXpert-v1.0-small          # FILL IN: folder containing train/ and valid/
  train_manifest: data/splits/train.csv
  dev_manifest: data/splits/dev.csv
  final_eval_manifest: data/audit/final_eval.csv
  image_size: 224
  num_workers: 8

strategy: uzeroes        # uzeroes | uones | uignore (override with --strategy)

model: densenet121

training:
  seed: 6018
  epochs: 10
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-5
  early_stopping_patience: 4
  augment: true

outputs: outputs
