# Group 23 — Kaggle formal run. Data is auto-mounted from the chexpert
# dataset (ashery/chexpert); no download needed.
# Run:  python scripts/train.py --config configs/kaggle.yaml --strategy uzeroes

data:
  image_root: /kaggle/input/datasets/ashery/chexpert
  train_manifest: data/splits/train.csv
  dev_manifest: data/splits/dev.csv
  final_eval_manifest: data/audit/final_eval.csv
  image_size: 224
  num_workers: 2

strategy: uzeroes

model: densenet121

training:
  seed: 6018
  epochs: 10
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-5
  early_stopping_patience: 4
  augment: true

outputs: outputs
